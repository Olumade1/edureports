<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Students</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <link rel="stylesheet" href="style.css">

  <script src="config.js"></script>
  <script src="api.js"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 dark:text-white">

<div class="flex flex-col md:flex-row min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-full md:w-64 bg-white dark:bg-gray-800 shadow-lg p-5">

    <div class="flex items-center justify-between md:block">

      <h2 class="text-2xl font-bold text-blue-600 mb-4">
        EduReports
      </h2>

      <button
        onclick="toggleDarkMode()"
        class="bg-black text-white px-3 py-2 rounded text-sm"
      >
        🌙
      </button>

    </div>

    <nav class="space-y-2">

      <a href="students.html"
         class="block p-2 rounded bg-blue-100 dark:bg-blue-900">
         Students
      </a>

      <a href="subjects.html"
         class="block p-2 rounded hover:bg-blue-100 dark:hover:bg-gray-700">
         Subjects
      </a>

      <a href="scores.html"
         class="block p-2 rounded hover:bg-blue-100 dark:hover:bg-gray-700">
         Scores
      </a>

      <a href="report.html"
         class="block p-2 rounded hover:bg-blue-100 dark:hover:bg-gray-700">
         Reports
      </a>

      <a href="rankings.html"
         class="block p-2 rounded hover:bg-blue-100 dark:hover:bg-gray-700">
         Rankings
      </a>

      <a href="verify.html"
         class="block p-2 rounded hover:bg-blue-100 dark:hover:bg-gray-700">
         Verify
      </a>

    </nav>

    <button
      onclick="logout()"
      class="mt-6 w-full bg-red-500 text-white py-2 rounded hover:bg-red-600"
    >
      Logout
    </button>

  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-4 md:p-6 overflow-auto">

    <!-- TOP BAR -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

      <h1 class="text-2xl font-bold">
        Students
      </h1>

      <input
        type="text"
        id="search"
        placeholder="Search student..."
        onkeyup="loadStudents()"
        class="border p-2 rounded w-full md:w-80 dark:bg-gray-800"
      />

    </div>

    <!-- ADD STUDENT -->
    <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded shadow mb-6">

      <h3 class="font-semibold mb-4 text-lg">
        Add Student
      </h3>

      <form id="form" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <input
          type="text"
          id="name"
          placeholder="Student Name"
          class="border p-2 rounded dark:bg-gray-700"
          required
        >

        <input
          type="text"
          id="studentClass"
          placeholder="Class"
          class="border p-2 rounded dark:bg-gray-700"
          required
        >

        <select
          id="gender"
          class="border p-2 rounded dark:bg-gray-700"
        >
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>

        <input
          type="date"
          id="dob"
          class="border p-2 rounded dark:bg-gray-700"
        >

        <input
          type="text"
          id="address"
          placeholder="Address"
          class="border p-2 rounded md:col-span-2 dark:bg-gray-700"
        >

        <input
          type="file"
          id="photo"
          class="border p-2 rounded md:col-span-2 dark:bg-gray-700"
        >

        <button
          type="submit"
          class="md:col-span-2 bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
        >
          Add Student
        </button>

      </form>

    </div>

    <!-- STUDENTS -->
    <div class="bg-white dark:bg-gray-800 p-4 md:p-6 rounded shadow">

      <h3 class="font-semibold mb-4 text-lg">
        All Students
      </h3>

      <div id="studentList" class="space-y-3"></div>

    </div>

  </main>

</div>

<script>

/* DARK MODE */

function toggleDarkMode() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
  );
}

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark");
}

/* AUTH */

if (!localStorage.getItem("token")) {
  window.location.href = "login.html";
}

/* VARIABLES */

const form = document.getElementById("form");
const list = document.getElementById("studentList");

/* LOAD STUDENTS */

async function loadStudents() {

  try {

    const search =
      document.getElementById("search").value;

    const res = await api(
      `API_URL/students?search=${search}`
    );

    const data = await res.json();

    list.innerHTML = "";

    if (!Array.isArray(data)) {

      list.innerHTML = `
        <p class="text-red-500">
          Failed to load students
        </p>
      `;

      return;
    }

    if (data.length === 0) {

      list.innerHTML = `
        <p class="text-gray-500">
          No students found
        </p>
      `;

      return;
    }

    data.forEach((s) => {

      const imageUrl = s.photo
        ? "API_URL" + s.photo
        : "";

      list.innerHTML += `
        <div class="border dark:border-gray-700 p-4 rounded flex flex-col md:flex-row md:items-center gap-4">

          <img
            src="${imageUrl}"
            class="w-16 h-16 rounded-full bg-gray-200 object-cover"
          >

          <div class="flex-1">

            <p class="font-bold text-lg">
              ${s.name}
            </p>

            <p class="text-sm text-gray-500">
              ${s.class}
            </p>

          </div>

          <div class="flex gap-2">

            <button
              onclick="deleteStudent(${s.id})"
              class="bg-red-500 text-white px-3 py-1 rounded"
            >
              Delete
            </button>

          </div>

        </div>
      `;
    });

  } catch(err) {

    console.log(err);

    list.innerHTML = `
      <p class="text-red-500">
        Cannot connect to server
      </p>
    `;
  }
}

/* ADD STUDENT */

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    const studentName =
      document.getElementById("name").value.trim();

    const studentClass =
      document.getElementById("studentClass").value.trim();

    const gender =
      document.getElementById("gender").value;

    const dob =
      document.getElementById("dob").value;

    const address =
      document.getElementById("address").value.trim();

    let photoUrl = "";

    const file =
      document.getElementById("photo").files[0];

    if (file) {

      const formData = new FormData();

      formData.append("file", file);

      const uploadRes = await fetch(
        "API_URL/upload/photo",
        {
          method: "POST",
          body: formData
        }
      );

      const uploadData = await uploadRes.json();

      photoUrl = uploadData.url;
    }

    const res = await api(
      "API_URL/students",
      {
        method: "POST",

        body: JSON.stringify({
          name: studentName,
          class: studentClass,
          gender,
          dob,
          address,
          photo: photoUrl
        })
      }
    );

    const data = await res.json();

    if (data.success) {

      alert("✅ Student added");

      form.reset();

      loadStudents();

    } else {

      alert("❌ Failed");
    }

  } catch(err) {

    console.log(err);

    alert("❌ Error");
  }
});

/* DELETE */

async function deleteStudent(id) {

  if (!confirm("Delete student?")) return;

  await api(
    `API_URL/students/${id}`,
    {
      method: "DELETE"
    }
  );

  loadStudents();
}

/* LOGOUT */

function logout() {

  localStorage.clear();

  window.location.href = "login.html";
}

/* INIT */

loadStudents();

</script>

</body>
</html>
