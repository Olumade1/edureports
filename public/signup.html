<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Signup</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<button onclick="toggleDarkMode()">

</button>

<script>
function toggleDarkMode() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
  );

}

if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark");
}
</script>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">

  <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
    Create Account
  </h1>

  <form id="signupForm" class="space-y-4">

    <input
      type="text"
      id="username"
      placeholder="Username"
      class="w-full border p-3 rounded"
      required
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
      class="w-full border p-3 rounded"
      required
    />

    <select
      id="role"
      class="w-full border p-3 rounded"
    >
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
    </select>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-3 rounded"
    >
      Create Account
    </button>

  </form>

  <p id="message" class="mt-4 text-center"></p>

  <p class="text-center mt-4">
    Already have an account?

    <a
      href="login.html"
      class="text-blue-600 font-semibold"
    >
      Login
    </a>
  </p>

</div>

<script>

const form = document.getElementById("signupForm");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  const res = await api("API_URL/signup", {
    method: "POST",
    body: JSON.stringify({
      username,
      password,
      role
    })
  });

  const data = await res.json();

  if (data.success) {

    document.getElementById("message").innerHTML =
      "<span class='text-green-600'>Account created successfully</span>";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1000);

  } else {

    document.getElementById("message").innerHTML =
      "<span class='text-red-600'>Signup failed</span>";

  }

});

</script>

</body>
</html>
